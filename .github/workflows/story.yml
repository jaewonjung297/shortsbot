name: story

# Modes: reddit_story (paste a post), in_this_town (town rule, optional), what_if (premise, optional) -> TikTok inbox draft.
# in_this_town stops at two checkpoints: no rule -> 10 pitched rules; rule -> story bible to approve. Re-run with
# from_run=<bible run> and approved=true to render it (or approved=true on the first run to do everything at once).
# Start it with the terminal command (scripts/story), from Actions -> story -> Run workflow, or:
#   gh workflow run story.yml -f story="$(pbpaste)"
#   gh workflow run story.yml -f mode=in_this_town -f story="In this town, your hair turns gray when you stop being curious."
#   gh workflow run story.yml -f example=story_cat -f send_to_inbox=false      # skip Claude, use examples/story_cat.json
run-name: "${{ inputs.mode || 'reddit_story' }}: ${{ inputs.label || inputs.example || inputs.from_run || 'new video' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Format"
        type: choice
        options: [reddit_story, in_this_town, what_if]
        default: reddit_story
      story:
        description: "reddit_story: the Reddit post. in_this_town: the town rule (empty: pitch 10). what_if: a premise (optional)"
        type: string
        default: ""
      example:
        description: "Developer test: spec name in examples/ (leave empty)"
        type: string
        default: ""
      from_run:
        description: "Re-render: id of an earlier run whose spec to reuse (leave empty)"
        type: string
        default: ""
      approved:
        description: "in_this_town: render without stopping for bible approval (or render the bible from from_run)"
        type: boolean
        default: false
      runtime:
        description: "in_this_town: target length in seconds"
        type: choice
        options: ["20", "45", "60", "75", "90", "150"]
        default: "75"
      town_name:
        description: "in_this_town: town name (empty: Claude invents one)"
        type: string
        default: ""
      notes:
        description: "Optional notes for Claude (tone, what to emphasize; for a bible from from_run: the tweaks)"
        type: string
        default: ""
      voice:
        description: "Narrator voice"
        type: choice
        options: [auto, af_heart, af_bella, am_michael, am_adam]
        default: auto
      parts:
        description: "Parallel render jobs"
        type: choice
        options: ["4", "6", "8"]
        default: "6"
      send_to_inbox:
        description: "Send the finished video to my TikTok inbox as a draft"
        type: boolean
        default: true
      label:
        description: "Name for this run (optional)"
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHON: "3.12"

jobs:
  what_if:
    name: "what if (legacy pipeline)"
    if: inputs.mode == 'what_if'
    permissions:
      contents: write
    uses: ./.github/workflows/tiktok.yml
    with:
      premise: ${{ inputs.story }}
      send_to_inbox: ${{ inputs.send_to_inbox }}
    secrets: inherit

  condense:
    name: "1 · condense (Claude)"
    if: inputs.mode != 'what_if'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.parts.outputs.list }}
      stage: ${{ steps.condense.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON }}", cache: pip }
      - run: pip install anthropic
      - name: Spec or bible from an earlier run
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with: { pattern: "{spec,bible}", merge-multiple: true, path: work, run-id: "${{ inputs.from_run }}", github-token: "${{ github.token }}" }
      - name: Post / rule -> pitches, bible or spec
        id: condense
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHORTSBOT_MODEL: ${{ vars.SHORTSBOT_MODEL || 'claude-sonnet-5-5' }}
          STORY: ${{ inputs.story }}
          EXAMPLE: ${{ inputs.example }}
          NOTES: ${{ inputs.notes }}
          VOICE: ${{ inputs.voice }}
          MODE: ${{ inputs.mode || 'reddit_story' }}
          APPROVED: ${{ inputs.approved }}
          RUNTIME: ${{ inputs.runtime || '75' }}
          TOWN_NAME: ${{ inputs.town_name }}
        run: |
          mkdir -p work
          stage=spec
          if [ "$MODE" = in_this_town ] && [ ! -f work/spec.json ] && [ -z "$EXAMPLE" ]; then
            # checkpoints: pitch (no rule) -> bible (approve) -> spec
            args=(--mode in_this_town --dir work --runtime "$RUNTIME")
            [ -n "$NOTES" ] && args+=(--notes "$NOTES")
            if [ -f work/bible.json ] && [ "$APPROVED" = true ]; then
              echo "rendering the approved bible from run ${{ inputs.from_run }}"
              python -m shortsbot.story condense "${args[@]}"
            elif [ -z "$STORY" ] && [ ! -f work/bible.json ]; then
              python -m shortsbot.story pitch "${args[@]}"; stage=pitch
            else
              if [ -n "$STORY" ]; then printf '%s\n' "$STORY" > work/rule.txt; args+=(--story work/rule.txt); rm -f work/bible.json; fi
              [ -n "$TOWN_NAME" ] && args+=(--town-name "$TOWN_NAME")
              python -m shortsbot.story bible "${args[@]}"; stage=bible
              if [ "$APPROVED" = true ]; then python -m shortsbot.story condense "${args[@]}"; stage=spec; fi
            fi
          elif [ -f work/spec.json ]; then
            echo "using spec from run ${{ inputs.from_run }}"
          elif [ -n "$EXAMPLE" ] && [ -z "$STORY" ]; then
            cp "examples/${EXAMPLE%.json}.json" work/spec.json
          else
            [ -n "$STORY" ] || [ "$MODE" != reddit_story ] || { echo "::error::paste a Reddit post into the story box"; exit 1; }
            args=(condense --mode "$MODE" --dir work)
            if [ -n "$STORY" ]; then printf '%s\n' "$STORY" > work/story.txt; args+=(--story work/story.txt); fi
            [ -n "$NOTES" ] && args+=(--notes "$NOTES")
            python -m shortsbot.story "${args[@]}"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          [ "$stage" = spec ] || exit 0
          if [ "$VOICE" != "auto" ]; then jq --arg v "$VOICE" '.voice=$v' work/spec.json > work/s && mv work/s work/spec.json; fi
          python -c "import json,sys; from shortsbot.story.spec import validate; e=validate(json.load(open('work/spec.json'))); sys.exit('\n'.join(e) if e else 0)"
      - id: parts
        run: echo "list=$(jq -cn --argjson n ${{ inputs.parts }} '[range($n)]')" >> "$GITHUB_OUTPUT"
      - name: Checkpoint summary
        if: steps.condense.outputs.stage != 'spec'
        run: |
          if [ "${{ steps.condense.outputs.stage }}" = pitch ]; then
            cat work/pitches.md
            echo; echo "Pick one and run again with it as the story (or use scripts/story --mode in_this_town)."
          else
            cat work/bible.md
            echo; echo "**Approve:** run again with from_run=${{ github.run_id }} and approved=true. **Tweak:** from_run=${{ github.run_id }}, approved=false and your notes."
          fi >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.condense.outputs.stage == 'pitch'
        with: { name: pitches, path: "work/pitches.json\nwork/pitches.md", retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: hashFiles('work/bible.json') != ''
        with: { name: bible, path: "work/bible.json\nwork/bible.md", retention-days: 7 }
      - name: Summary
        if: steps.condense.outputs.stage == 'spec'
        run: |
          {
            echo "## $(jq -r .title work/spec.json)"
            echo; echo "| # | scene | narration |"; echo "|---|---|---|"
            jq -r '.lines | to_entries[] | "| \(.key + 1) | \(.value.scene) | \(.value.text) |"' work/spec.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.condense.outputs.stage == 'spec'
        with: { name: spec, path: work/spec.json, retention-days: 7 }

  narrate:
    name: "2 · narrate (Kokoro TTS)"
    needs: condense
    if: needs.condense.outputs.stage == 'spec'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON }}", cache: pip }
      - uses: actions/cache@v4
        with: { path: ~/.cache/kokoro, key: kokoro-v1.0 }
      - uses: ./.github/actions/system-packages
        with: { packages: ffmpeg, key: assemble }
      - run: pip install numpy kokoro-onnx soundfile
      - uses: actions/download-artifact@v4
        with: { name: spec, path: work }
      - run: python -m shortsbot.story narrate --dir work
      - uses: actions/upload-artifact@v4
        with: { name: narration, path: "work/narration.wav\nwork/timeline.json", retention-days: 7 }

  render:
    name: "3 · render part ${{ matrix.part }}"
    needs: [condense, narrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        part: ${{ fromJSON(needs.condense.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/system-packages
        with: { packages: "ffmpeg libcairo2-dev pkg-config fonts-inter", key: render }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON }}", cache: pip }
      - run: pip install pycairo numpy
      - uses: actions/download-artifact@v4
        with: { pattern: "{spec,narration}", path: work, merge-multiple: true }
      - run: python -m shortsbot.story render --dir work --part ${{ matrix.part }} --parts ${{ inputs.parts }}
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.part }}", path: work/part_*.mp4, retention-days: 1 }

  assemble:
    name: "4 · assemble (music + mix)"
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/system-packages
        with: { packages: ffmpeg, key: assemble }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON }}", cache: pip }
      - run: pip install numpy scipy soundfile
      - uses: actions/download-artifact@v4
        with: { path: work, merge-multiple: true }
      - run: python -m shortsbot.story assemble --dir work
      - uses: actions/upload-artifact@v4
        with:
          name: story-${{ github.run_id }}
          path: |
            work/short.mp4
            work/caption.txt
            work/script.txt
            work/cover.jpg
            work/spec.json
            work/result.json
          retention-days: 7
      - name: Summary
        run: |
          {
            echo "## Video ready ($(jq -r .duration work/result.json) s)"
            echo "Download **story-${{ github.run_id }}** from the artifacts below."
            echo; echo "**Caption**"; echo '```'; cat work/caption.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deliver:
    name: "5 · deliver (TikTok inbox draft)"
    needs: assemble
    if: inputs.send_to_inbox
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON }}", cache: pip }
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with: { name: "story-${{ github.run_id }}", path: work }
      - name: Upload to TikTok inbox
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          [ -n "$TIKTOK_REFRESH_TOKEN" ] || { echo "::error::TikTok secrets not set yet (see CLAUDE.md)"; exit 1; }
          python -m shortsbot.story deliver --dir work
          echo "Sent to the TikTok inbox. Open the TikTok app to finish the post." >> "$GITHUB_STEP_SUMMARY"
