name: instagram-draft

# Step 1 of 2: make a Reel and keep it for review. Nothing is posted.
# Run from Actions -> instagram-draft -> Run workflow (also works in the GitHub mobile app), or:
#   gh workflow run instagram-draft.yml -f premise="What if the Moon came twice as close?"
on:
  workflow_dispatch:
    inputs:
      premise:
        description: "Premise (leave empty to let Claude pick a fresh one)"
        type: string
        default: ""
      template:
        description: "Scene template"
        type: choice
        options: [auto, car, window, hill]
        default: auto
  # daily draft:
  # schedule:
  #   - cron: "23 12 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev pkg-config fonts-inter fonts-crosextra-caladea
          fc-cache -f
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Write, review, render, package
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHORTSBOT_MODEL: ${{ vars.SHORTSBOT_MODEL || 'claude-sonnet-5-5' }}
          PREMISE: ${{ inputs.premise }}
          TEMPLATE: ${{ inputs.template || 'auto' }}
        run: |
          args=(instagram --out out/reel --template "$TEMPLATE")
          [ -n "$PREMISE" ] && args+=(--premise "$PREMISE")
          python -m shortsbot "${args[@]}"
      - name: Keep the draft for review
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            out/reel/short.mp4
            out/reel/caption.txt
            out/reel/voiceover_script.txt
            out/reel/cover.jpg
            out/reel/preview_*.png
            out/reel/spec.json
            out/reel/result.json
          retention-days: 7
      - name: Job summary
        run: |
          {
            echo "## $(jq -r .premise out/reel/spec.json)"
            echo; echo "Download **reel** below to watch it. Happy with it? Publish it with:"
            echo; echo '```'; echo "gh workflow run instagram-publish.yml -f draft_run_id=${{ github.run_id }}"; echo '```'
            echo "or **Actions -> instagram-publish -> Run workflow** with draft run id \`${{ github.run_id }}\`."
            echo; echo "**Caption**"; echo '```'; cat out/reel/caption.txt; echo '```'
            echo; echo "**Voiceover script**"; echo '```'; cat out/reel/voiceover_script.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit history
        run: |
          git config user.name "shortsbot"; git config user.email "shortsbot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "reel draft: $(jq -r '.[-1].premise' history.json)"
          git push
